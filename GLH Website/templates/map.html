<!-- Allows for the navbar and footer to be used across all html files --> 
{% extends "base.html" %}

<!-- Allows for the html content to be displayed --> 
{% block content %}
    <!-- Displays the title for webpage -->
    <title>
        
        {% block title %}Map{% endblock %}
    </title>
    <style>
        #map { height: 700px; 
        }
        .product {
            margin-top: 10px;
            margin-left: 10px;
            margin-right: 10px;
            padding: 15px;
            width: 200px;
            height: 350px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            border: 2px solid black;
            box-shadow: 0px 7px 6.3px 0px rgba(0, 0, 0, 0.336);
            border-radius: 16px;
            font-family: "Inter", sans-serif;
        }

        .product h1 {
            font-size: 20px;
        }
        .product p {
            font-size: 16px;
        }
        .top_picks {
            display: flex;
            align-items: center;
            justify-content: center;
            margin-top: 30px;
            margin-bottom: 30px;
        }
        @media (max-width: 800px) {
            .top_picks {
                flex-direction: column;
            }
        }
    </style>
    <div id="map"></div>
    <h1 style="text-align: center;">Meet the producers</h1>
    <div class="top_picks">
        <!-- Displays all farms that are fetched from the producer_farms table --> 
        {% for farm in farms %}
            <section class="product">
                    <img src="{{farm['image']}}" alt="" width="120px">
                    <h1>{{farm["farm"]}}</h1>
                    <p style="word-break: break-all;">{{farm["description"]| truncate(40)}}</p>
                    <p>Contact us: +44 {{farm["telephone"]}}</p>
                    <p>{{farm["website"]}}</p>

            </section>
        {% endfor %}
    </div>
    <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
    <script>
    var map = L.map('map');

    // Load map tiles
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // Default to London if location fails
    const fallbackLat = 51.5074;
    const fallbackLon = -0.1278;

    function loadFarms(lat, lon) {
        // Center map
        map.setView([lat, lon], 13);

        // Marker for center point
        L.marker([lat, lon]).addTo(map)
            .bindPopup("Showing farms near this location")
            .openPopup();

        // Fetch farms
        fetch(`https://nominatim.openstreetmap.org/search?format=json&q=farms&bounded=1&viewbox=${lon-0.1},${lat+0.1},${lon+0.1},${lat-0.1}`)
            .then(res => res.json())
            .then(data => {
                data.forEach(place => {
                    L.marker([place.lat, place.lon])
                        .addTo(map)
                        .bindPopup(place.display_name);
                });
            });
    }

    // Try to get user location
    navigator.geolocation.getCurrentPosition(
        function(position) {
            loadFarms(position.coords.latitude, position.coords.longitude);
        },
        function() {
            alert("Could not get your location — showing farms near London instead.");
            loadFarms(fallbackLat, fallbackLon);
        }
    );
    </script>

{% endblock %}
